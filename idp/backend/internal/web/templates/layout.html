{{define "head"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}} · IDP</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--muted:#6b7280;--line:#dfe3ea;--card:#fff;--ok:#1f7a4d;--bad:#b42318;--busy:#b25e09;--accent:#2f5bd3}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{background:#1d2330;color:#fff;padding:10px 20px;display:flex;gap:20px;align-items:center}header a{color:#fff;text-decoration:none;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:#e8ebf0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.busy{color:var(--busy)}.idle{color:var(--muted)}
.badge.ok{background:#e3f4ea}.badge.bad{background:#fde8e6}.badge.busy{background:#fdf0dc}
.problems{border-color:#f2b8b5;background:#fff5f4}.problems li{margin:3px 0}
.warn{border-color:#f5d08a;background:#fffaf0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
label{font-weight:600;display:block;margin:6px 0 2px}select,input[type=text]{padding:5px 7px;border:1px solid var(--line);border-radius:5px;min-width:160px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}button.danger{background:var(--bad)}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}.muted{color:var(--muted)}.wave{font-weight:700;white-space:nowrap}
.action-CREATE,.action-DEPLOY,.action-LINK{color:var(--ok);font-weight:700}.action-UPDATE{color:var(--busy);font-weight:700}.action-REUSE{color:var(--muted);font-weight:700}
.action-DESTROY,.action-REMOVE,.action-UNLINK{color:var(--bad);font-weight:700}
</style></head><body><header><a href="/">IDP · Deploy Application</a><a href="/ui/applications">Application definitions</a></header><main>{{end}}
{{define "foot"}}</main></body></html>{{end}}
{{define "problems"}}{{if .}}<div class="card problems"><strong>The request was rejected</strong><ul>{{range .}}<li><code>{{.Code}}</code> {{.Message}}</li>{{end}}</ul></div>{{end}}{{end}}
