name: Documentation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate documentation contract
        run: python3 scripts/check_docs.py

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
